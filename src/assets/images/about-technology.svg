<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="800" height="680" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid Lines -->
  <g opacity="0.12" stroke="#60A5FA" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="680" stroke-dasharray="4 6" />
    <line x1="200" y1="0" x2="200" y2="680" stroke-dasharray="4 6" />
    <line x1="300" y1="0" x2="300" y2="680" stroke-dasharray="4 6" />
    <line x1="400" y1="0" x2="400" y2="680" stroke-dasharray="4 6" />
    <line x1="500" y1="0" x2="500" y2="680" stroke-dasharray="4 6" />
    <line x1="600" y1="0" x2="600" y2="680" stroke-dasharray="4 6" />
    <line x1="700" y1="0" x2="700" y2="680" stroke-dasharray="4 6" />
    <line x1="0" y1="100" x2="800" y2="100" stroke-dasharray="4 6" />
    <line x1="0" y1="200" x2="800" y2="200" stroke-dasharray="4 6" />
    <line x1="0" y1="300" x2="800" y2="300" stroke-dasharray="4 6" />
    <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="4 6" />
    <line x1="0" y1="500" x2="800" y2="500" stroke-dasharray="4 6" />
    <line x1="0" y1="600" x2="800" y2="600" stroke-dasharray="4 6" />
  </g>

  <!-- Ambient Glow Orbs behind Core -->
  <circle cx="400" cy="340" r="140" fill="#2563EB" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="170" cy="180" r="80" fill="#38BDF8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="630" cy="180" r="80" fill="#34D399" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="170" cy="500" r="80" fill="#A855F7" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="630" cy="500" r="80" fill="#FBBF24" opacity="0.12" filter="url(#softGlow)" />

  <!-- Data Bus Circuit Lines to Center -->
  <!-- Line to Top-Left (React 19) -->
  <path d="M 270 210 Q 330 260 360 300" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
  <circle cx="310" cy="250" r="4" fill="#38BDF8" filter="url(#glow)" />

  <!-- Line to Top-Right (Web Crypto AES-256) -->
  <path d="M 530 210 Q 470 260 440 300" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
  <circle cx="490" cy="250" r="4" fill="#34D399" filter="url(#glow)" />

  <!-- Line to Bottom-Left (Cloudflare D1 Edge) -->
  <path d="M 270 470 Q 330 420 360 380" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
  <circle cx="310" cy="430" r="4" fill="#A855F7" filter="url(#glow)" />

  <!-- Line to Bottom-Right (PWA & IndexedDB) -->
  <path d="M 530 470 Q 470 420 440 380" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
  <circle cx="490" cy="430" r="4" fill="#FBBF24" filter="url(#glow)" />

  <!-- Line to Top Header (Web Speech API) -->
  <path d="M 400 135 L 400 270" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
  <circle cx="400" cy="190" r="4" fill="#F43F5E" filter="url(#glow)" />

  <!-- ==================== CENTRAL HUB (123 ToDo Engine) ==================== -->
  <g transform="translate(400, 340)">
    <!-- Outer Pulse Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
    <circle cx="0" cy="0" r="64" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5" filter="url(#nodeShadow)" />
    <circle cx="0" cy="0" r="54" fill="url(#coreGlow)" />

    <!-- 123 Icon Graphic inside core -->
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">1 2 3</text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#93C5FD" text-anchor="middle" letter-spacing="2">CORE ENGINE</text>

    <!-- Rotating Activity Orbit Indicators -->
    <circle cx="0" cy="-64" r="5" fill="#60A5FA" filter="url(#glow)" />
    <circle cx="64" cy="0" r="4" fill="#34D399" filter="url(#glow)" />
    <circle cx="0" cy="64" r="5" fill="#FBBF24" filter="url(#glow)" />
    <circle cx="-64" cy="0" r="4" fill="#A855F7" filter="url(#glow)" />
  </g>

  <!-- ==================== NODE 1: REACT 19 ENGINE (Top-Left) ==================== -->
  <g transform="translate(60, 110)" filter="url(#nodeShadow)">
    <rect width="230" height="135" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#cyanGrad)" />
    <!-- React Atom Icon -->
    <circle cx="35" cy="35" r="4" fill="#FFFFFF" />
    <ellipse cx="35" cy="35" rx="13" ry="5" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(30 35 35)" />
    <ellipse cx="35" cy="35" rx="13" ry="5" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(90 35 35)" />
    <ellipse cx="35" cy="35" rx="13" ry="5" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(150 35 35)" />

    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#38BDF8" letter-spacing="1.5">UI RUNTIME</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">React 19 Engine</text>

    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Zero-lag concurrent UI,</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">instant state synchronization,</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">⚡ Sub-16ms Frame Renders</text>
  </g>

  <!-- ==================== NODE 2: WEB CRYPTO API (Top-Right) ==================== -->
  <g transform="translate(510, 110)" filter="url(#nodeShadow)">
    <rect width="230" height="135" rx="16" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#emeraldGrad)" />
    <!-- Shield / Padlock Icon -->
    <path d="M 35 24 L 44 28 C 44 36 39 42 35 44 C 31 42 26 36 26 28 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="35" cy="33" r="2" fill="#059669" />
    <path d="M 35 35 L 35 38" stroke="#059669" stroke-width="1.5" stroke-linecap="round" />

    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#34D399" letter-spacing="1.5">ZERO KNOWLEDGE</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Web Crypto API</text>

    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">AES-256-GCM hardware vault,</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">client-side PBKDF2 keys,</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34D399">🛡️ End-to-End Encrypted</text>
  </g>

  <!-- ==================== NODE 3: TOP CENTER (Web Speech AI Dictation) ==================== -->
  <g transform="translate(265, 30)" filter="url(#nodeShadow)">
    <rect width="270" height="85" rx="16" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5" />
    <rect x="16" y="18" width="36" height="48" rx="10" fill="url(#roseGrad)" />
    <!-- Mic Icon -->
    <rect x="29" y="27" width="10" height="18" rx="5" fill="#FFFFFF" />
    <path d="M 25 36 C 25 43 43 43 43 36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="34" y1="44" x2="34" y2="52" stroke="#FFFFFF" stroke-width="2" />
    <line x1="28" y1="52" x2="40" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#F43F5E" letter-spacing="1.5">SPEECH RECOGNITION</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Web Speech API</text>
    <text x="64" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Live dictation • Voice edits • Punctuation</text>
  </g>

  <!-- ==================== NODE 4: CLOUDFLARE D1 (Bottom-Left) ==================== -->
  <g transform="translate(60, 430)" filter="url(#nodeShadow)">
    <rect width="230" height="135" rx="16" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#purpleGrad)" />
    <!-- Serverless Edge Cloud / DB Icon -->
    <ellipse cx="35" cy="27" rx="10" ry="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 25 27 L 25 35 C 25 37 45 37 45 35 L 45 27" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 25 35 L 25 43 C 25 45 45 45 45 43 L 45 35" fill="none" stroke="#FFFFFF" stroke-width="1.5" />

    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#C084FC" letter-spacing="1.5">SERVERLESS EDGE</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Cloudflare D1</text>

    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Global SQLite edge replica,</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">6-digit ephemeral device sync,</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#C084FC">🌐 Sub-500ms Edge Latency</text>
  </g>

  <!-- ==================== NODE 5: PWA & STORAGE (Bottom-Right) ==================== -->
  <g transform="translate(510, 430)" filter="url(#nodeShadow)">
    <rect width="230" height="135" rx="16" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#amberGrad)" />
    <!-- Phone / PWA Download Icon -->
    <rect x="27" y="23" width="16" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="35" cy="42" r="1.5" fill="#FFFFFF" />
    <path d="M 32 30 L 35 34 L 38 30" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FBBF24" letter-spacing="1.5">PERSISTENT STORAGE</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">PWA &amp; IndexedDB</text>

    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Service worker offline cache,</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">automated 24h shadow backups,</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">📱 100% Offline-First</text>
  </g>

  <!-- Bottom Metric Pills Banner -->
  <g transform="translate(100, 600)">
    <rect width="600" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(45, 29)">
      <circle cx="0" cy="0" r="4" fill="#34D399" filter="url(#glow)" />
      <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Zero Trackers</text>
    </g>
    
    <line x1="165" y1="14" x2="165" y2="34" stroke="#475569" stroke-width="1" />
    
    <g transform="translate(195, 29)">
      <circle cx="0" cy="0" r="4" fill="#38BDF8" filter="url(#glow)" />
      <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">100% Client Encryption</text>
    </g>

    <line x1="395" y1="14" x2="395" y2="34" stroke="#475569" stroke-width="1" />
    
    <g transform="translate(425, 29)">
      <circle cx="0" cy="0" r="4" fill="#FBBF24" filter="url(#glow)" />
      <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Zero Data Lock-In</text>
    </g>
  </g>
</svg>
