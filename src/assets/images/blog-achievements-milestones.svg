<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Trophy Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Emerald Level 1 Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cosmic Level 9 Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Radial Ambient Light -->
  <circle cx="400" cy="225" r="280" fill="#3B82F6" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="180" r="180" fill="#EAB308" opacity="0.10" filter="url(#glow)" />
  <circle cx="620" cy="240" r="200" fill="#9333EA" opacity="0.10" filter="url(#glow)" />

  <!-- Decorative Stars / Sparkles -->
  <g fill="#FDE047" opacity="0.8">
    <path d="M 120 80 L 123 90 L 133 93 L 123 96 L 120 106 L 117 96 L 107 93 L 117 90 Z" />
    <path d="M 680 70 L 683 80 L 693 83 L 683 86 L 680 96 L 677 86 L 667 83 L 677 80 Z" />
    <path d="M 720 320 L 722 328 L 730 330 L 722 332 L 720 340 L 718 332 L 710 330 L 718 328 Z" />
    <path d="M 80 340 L 82 348 L 90 350 L 82 352 L 80 360 L 78 352 L 70 350 L 78 348 Z" />
  </g>

  <!-- Center Card UI: 10-Tier Achievements & Points Hub -->
  <g transform="translate(180, 50)">
    <!-- Container Card -->
    <rect width="440" height="350" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2" />
    
    <!-- Top Header in Card -->
    <rect width="440" height="64" rx="20" fill="#0F172A" />
    <rect y="44" width="440" height="20" fill="#0F172A" />

    <!-- Card Title & Trophy Icon -->
    <circle cx="44" cy="32" r="18" fill="url(#goldGrad)" />
    <!-- Mini Trophy In Circle -->
    <path d="M 38 25 L 50 25 L 48 33 C 48 36 45 38 44 38 C 43 38 40 36 40 33 Z" fill="#78350F" />
    <path d="M 42 38 L 46 38 L 46 41 L 42 41 Z" fill="#78350F" />
    <rect x="40" y="41" width="8" height="2" rx="1" fill="#78350F" />

    <text x="74" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15">Productivity &amp; Achievements</text>
    <text x="74" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">10-Tier Mastery &amp; Daily Streaks</text>

    <!-- Hero Level Banner -->
    <g transform="translate(20, 80)">
      <rect width="400" height="82" rx="12" fill="#0F172A" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.4" />
      
      <!-- Crown / Rank Badge -->
      <rect x="14" y="14" width="54" height="54" rx="10" fill="#FEF08A" fill-opacity="0.15" stroke="#EAB308" stroke-width="1.5" />
      <text x="41" y="49" font-size="26" text-anchor="middle">👑</text>

      <!-- Level Title & Points -->
      <text x="80" y="32" fill="#EAB308" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="1">LEVEL 10 • PINNACLE</text>
      <text x="80" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16">123 Immortal</text>

      <text x="385" y="36" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" text-anchor="end">52,480</text>
      <text x="385" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" text-anchor="end">Productivity Points</text>

      <!-- Progress Bar -->
      <rect x="14" y="74" width="372" height="4" rx="2" fill="#334155" />
      <rect x="14" y="74" width="372" height="4" rx="2" fill="url(#goldGrad)" />
    </g>

    <!-- 3 Mini Metric Cards -->
    <g transform="translate(20, 175)">
      <!-- Metric 1: Tasks Crushed -->
      <g transform="translate(0, 0)">
        <rect width="124" height="66" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">✓ Completed</text>
        <text x="12" y="46" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">1,420</text>
        <text x="12" y="58" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8">Tasks Archived</text>
      </g>

      <!-- Metric 2: Daily Streak -->
      <g transform="translate(138, 0)">
        <rect width="124" height="66" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">🔥 Daily Streak</text>
        <text x="12" y="46" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">42 <tspan font-size="11" fill="#94A3B8">Days</tspan></text>
        <text x="12" y="58" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8">Unbroken Focus</text>
      </g>

      <!-- Metric 3: 1-2-3 Balance -->
      <g transform="translate(276, 0)">
        <rect width="124" height="66" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">🎯 1-2-3 Balance</text>
        <text x="12" y="46" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15">1 / 2 / 3</text>
        <text x="12" y="58" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8">Must / Should / Could</text>
      </g>
    </g>

    <!-- Milestone Badges Showcase Pill Row -->
    <g transform="translate(20, 255)">
      <rect width="400" height="78" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">Milestone Badges &amp; Tiers</text>
      
      <!-- Badge Icons -->
      <g transform="translate(12, 30)">
        <!-- Badge 1: Starter -->
        <circle cx="18" cy="18" r="16" fill="url(#emeraldGrad)" opacity="0.9" />
        <text x="18" y="24" font-size="13" text-anchor="middle">🌱</text>

        <!-- Badge 2: Streak -->
        <circle cx="58" cy="18" r="16" fill="url(#flameGrad)" opacity="0.9" />
        <text x="58" y="24" font-size="13" text-anchor="middle">🔥</text>

        <!-- Badge 3: 1-2-3 -->
        <circle cx="98" cy="18" r="16" fill="url(#purpleGrad)" opacity="0.9" />
        <text x="98" y="24" font-size="13" text-anchor="middle">🎯</text>

        <!-- Badge 4: Checklist Slayer -->
        <circle cx="138" cy="18" r="16" fill="#2563EB" opacity="0.9" />
        <text x="138" y="24" font-size="13" text-anchor="middle">📋</text>

        <!-- Badge 5: Titan -->
        <circle cx="178" cy="18" r="16" fill="#EA580C" opacity="0.9" />
        <text x="178" y="24" font-size="13" text-anchor="middle">🚀</text>

        <!-- Badge 6: Century Club -->
        <circle cx="218" cy="18" r="16" fill="#DC2626" opacity="0.9" />
        <text x="218" y="24" font-size="13" text-anchor="middle">💯</text>

        <!-- Badge 7: Grandmaster -->
        <circle cx="258" cy="18" r="16" fill="#7C3AED" opacity="0.9" />
        <text x="258" y="24" font-size="13" text-anchor="middle">🌌</text>

        <!-- Badge 8: Immortal Crown -->
        <circle cx="298" cy="18" r="16" fill="url(#goldGrad)" opacity="0.9" />
        <text x="298" y="24" font-size="13" text-anchor="middle">👑</text>

        <!-- Tag Text -->
        <text x="330" y="22" fill="#EAB308" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11">10 LEVELS</text>
      </g>
    </g>
  </g>

  <!-- Left Side: Large 3D Glowing Trophy Graphic -->
  <g transform="translate(45, 150)">
    <!-- Glow -->
    <ellipse cx="60" cy="130" rx="50" ry="14" fill="#EAB308" opacity="0.3" filter="url(#glow)" />
    
    <!-- Trophy Body -->
    <path d="M 25 30 L 95 30 L 85 90 C 85 105 72 115 60 115 C 48 115 35 105 35 90 Z" fill="url(#goldGrad)" />
    <!-- Handles -->
    <path d="M 25 40 C 5 40 5 70 27 75" stroke="url(#goldGrad)" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 95 40 C 115 40 115 70 93 75" stroke="url(#goldGrad)" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="53" y="115" width="14" height="22" fill="#CA8A04" />
    <path d="M 30 137 L 90 137 L 96 148 L 24 148 Z" fill="url(#goldGrad)" />
    <!-- Star on Trophy -->
    <path d="M 60 52 L 63 60 L 71 60 L 65 65 L 67 73 L 60 68 L 53 73 L 55 65 L 49 60 L 57 60 Z" fill="#FFFFFF" />
  </g>

  <!-- Right Side: Glowing Streak Flame Graphic -->
  <g transform="translate(685, 160)">
    <!-- Glow -->
    <ellipse cx="40" cy="120" rx="35" ry="12" fill="#EF4444" opacity="0.3" filter="url(#glow)" />
    
    <!-- Outer Flame -->
    <path d="M 40 10 C 65 50 80 80 75 110 C 70 130 55 140 40 140 C 25 140 10 130 5 110 C 0 80 15 50 40 10 Z" fill="url(#flameGrad)" />
    <!-- Inner Flame -->
    <path d="M 40 50 C 55 75 62 95 58 115 C 55 128 48 134 40 134 C 32 134 25 128 22 115 C 18 95 25 75 40 50 Z" fill="#FDE047" />
  </g>
</svg>
