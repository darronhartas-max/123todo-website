<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="120" r="150" fill="#6366F1" opacity="0.18" filter="url(#glow)" />
  <circle cx="640" cy="160" r="160" fill="#EC4899" opacity="0.14" filter="url(#glow)" />
  <circle cx="400" cy="360" r="170" fill="#10B981" opacity="0.12" filter="url(#glow)" />

  <!-- Technical Grid Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.22">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="4 6" />
    <line x1="266" y1="0" x2="266" y2="450" stroke-dasharray="4 6" />
    <line x1="533" y1="0" x2="533" y2="450" stroke-dasharray="4 6" />
  </g>

  <!-- Top Center Badge -->
  <g transform="translate(240, 26)">
    <rect width="320" height="34" rx="17" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#818CF8" />
    <text x="34" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      123 TO DO • COMPLETE FEATURE MASTERY
    </text>
  </g>

  <!-- 6 Feature Cards in Ranked Hierarchy Grid (2 Rows x 3 Columns) -->
  
  <!-- ROW 1, CARD 1: 1-2-3 Priorities & Matrix (Tier 1) -->
  <g transform="translate(44, 76)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.3" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#7F1D1D" />
    <text x="32" y="38" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">#1</text>
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1-2-3 Priority Matrix</text>
    <text x="58" y="44" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">CRUCIAL DAILY FOCUS</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" line-height="1.4">
      Must Do, Should Do, Could Do buckets. Drag-and-drop reordering with zero bloat.
    </text>
    <!-- Visual Tier Bars -->
    <rect x="14" y="122" width="56" height="12" rx="6" fill="#EF4444" opacity="0.8" />
    <rect x="76" y="122" width="56" height="12" rx="6" fill="#F59E0B" opacity="0.8" />
    <rect x="138" y="122" width="56" height="12" rx="6" fill="#10B981" opacity="0.8" />
  </g>

  <!-- ROW 1, CARD 2: Clock Face Scheduling & Calendar (Tier 2) -->
  <g transform="translate(288, 76)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#0C4A6E" />
    <!-- Clock icon -->
    <circle cx="32" cy="32" r="10" stroke="#38BDF8" stroke-width="2" />
    <path d="M 32 26 L 32 32 L 36 34" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Clock Times &amp; Sync</text>
    <text x="58" y="44" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">SMART SCHEDULING</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Circular clock face picker, 1-tap presets, and 1-click sync to Google &amp; Apple Calendar.
    </text>
    <rect x="14" y="120" width="102" height="18" rx="6" fill="#0369A1" opacity="0.4" />
    <text x="65" y="133" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">9:00 AM • Daily</text>
  </g>

  <!-- ROW 1, CARD 3: Voice Dictation & Dual Skins (Tier 3) -->
  <g transform="translate(532, 76)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#581C87" />
    <!-- Mic icon -->
    <path d="M 32 24 C 30 24 28 26 28 28 L 28 34 C 28 36 30 38 32 38 C 34 38 36 36 36 34 L 36 28 C 36 26 34 24 32 24 Z" fill="#C084FC" />
    <path d="M 26 32 C 26 36 28 39 32 39 C 36 39 38 36 38 32" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" />
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Dual Skins &amp; Voice</text>
    <text x="58" y="44" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">HANDS-FREE CAPTURE</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Switch between Tasks &amp; Rapid Voice Notes mode with auto-punctuated dictation.
    </text>
    <rect x="14" y="120" width="118" height="18" rx="6" fill="#6B21A8" opacity="0.4" />
    <text x="73" y="133" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🎙️ Say "Add Task"</text>
  </g>

  <!-- ROW 2, CARD 4: Photo Attachments & Screenshots (Tier 4) -->
  <g transform="translate(44, 252)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#78350F" />
    <!-- Photo icon -->
    <rect x="24" y="24" width="16" height="16" rx="2" stroke="#FBBF24" stroke-width="1.5" />
    <circle cx="28" cy="28" r="1.5" fill="#FBBF24" />
    <path d="M 24 36 L 29 31 L 34 36 L 40 30" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" />
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Photo Attachments</text>
    <text x="58" y="44" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">VISUAL PROOF</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Attach up to 3 photos, paste ⌘V screenshots instantly, with full-screen Lightbox zoom.
    </text>
    <rect x="14" y="120" width="96" height="18" rx="6" fill="#B45309" opacity="0.3" />
    <text x="62" y="133" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🖼️ ⌘V Paste Support</text>
  </g>

  <!-- ROW 2, CARD 5: Zero-Knowledge Encrypted Sync (Tier 5) -->
  <g transform="translate(288, 252)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#064E3B" />
    <!-- Lock & Sync icon -->
    <rect x="25" y="27" width="14" height="11" rx="2" stroke="#34D399" stroke-width="1.5" />
    <path d="M 28 27 L 28 24 C 28 22 30 20 32 20 C 34 20 36 22 36 24 L 36 27" stroke="#34D399" stroke-width="1.5" />
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Zero-Knowledge Sync</text>
    <text x="58" y="44" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">AES-256-GCM E2EE</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Cloudflare D1 or Google Drive sync. 6-digit device pairing codes with zero data scanning.
    </text>
    <rect x="14" y="120" width="112" height="18" rx="6" fill="#047857" opacity="0.3" />
    <text x="70" y="133" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🔒 Client-Side Keys</text>
  </g>

  <!-- ROW 2, CARD 6: 10-Tier Streaks & Achievements (Tier 6) -->
  <g transform="translate(532, 252)" filter="url(#cardShadow)">
    <rect width="224" height="152" rx="14" fill="url(#cardGrad)" stroke="#EAB308" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#713F12" />
    <!-- Trophy icon -->
    <path d="M 26 24 L 38 24 L 38 31 C 38 34 35 37 32 37 C 29 37 26 34 26 31 Z" fill="#FACC15" />
    <path d="M 32 37 L 32 41 M 27 41 L 37 41" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
    <text x="58" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">10-Tier Achievements</text>
    <text x="58" y="44" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">GAMIFIED STREAKS</text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Earn productivity points, build daily streaks, and unlock 10 ranks to 123 Immortal.
    </text>
    <rect x="14" y="120" width="112" height="18" rx="6" fill="#854D0E" opacity="0.4" />
    <text x="70" y="133" fill="#FEF08A" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🏆 +10 Pts Per Task</text>
  </g>
</svg>
