<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="mainCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="sideCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Priority Gradients -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="180" cy="140" r="150" fill="#3B82F6" opacity="0.16" filter="url(#glow)" />
  <circle cx="680" cy="180" r="160" fill="#8B5CF6" opacity="0.15" filter="url(#glow)" />
  <circle cx="440" cy="380" r="170" fill="#10B981" opacity="0.12" filter="url(#glow)" />

  <!-- Technical Grid Pattern Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="4 6" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="450" stroke-dasharray="4 6" />
    <line x1="640" y1="0" x2="640" y2="450" stroke-dasharray="4 6" />
  </g>

  <!-- Top Badge: Feature Mastery -->
  <g transform="translate(235, 24)">
    <rect width="330" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="36" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      123 TO DO • FEATURE MASTERY GUIDE
    </text>
  </g>

  <!-- ============================================== -->
  <!-- LEFT HERO PANEL: Interactive App Interface Showcase -->
  <!-- ============================================== -->
  <g transform="translate(48, 76)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="414" height="344" rx="16" fill="url(#mainCardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Window Controls & Header Bar -->
    <circle cx="22" cy="22" r="5" fill="#EF4444" />
    <circle cx="36" cy="22" r="5" fill="#F59E0B" />
    <circle cx="50" cy="22" r="5" fill="#10B981" />

    <!-- Dual Skin Toggle Pill in Window -->
    <rect x="260" y="10" width="138" height="25" rx="12.5" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <rect x="262" y="12" width="66" height="21" rx="10.5" fill="#2563EB" />
    <text x="295" y="26.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ Tasks</text>
    <text x="362" y="26.5" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🎙️ Notes</text>

    <line x1="0" y1="44" x2="414" y2="44" stroke="#334155" stroke-width="1" opacity="0.6" />

    <!-- Section Header: Today's Priorities -->
    <text x="18" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
      TODAY'S PRIORITIES
    </text>
    <rect x="330" y="53" width="68" height="18" rx="9" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
    <text x="364" y="65.5" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ Pro Mode</text>

    <!-- TASK 1: MUST DO (High Priority) -->
    <g transform="translate(18, 78)">
      <rect width="378" height="74" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.2" />
      <!-- Priority Badge & Pill -->
      <rect x="12" y="12" width="24" height="20" rx="6" fill="url(#p1Grad)" />
      <text x="24" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P1</text>
      <!-- Time Badge -->
      <rect x="42" y="12" width="58" height="20" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="71" y="26" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">09:00 AM</text>
      <!-- Task Title -->
      <text x="108" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Client Strategy Proposal</text>
      <!-- Checkmark Button -->
      <circle cx="356" cy="22" r="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <!-- Subtasks Progress & Tag -->
      <text x="14" y="54" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Checklist (2/3 complete)</text>
      <rect x="156" y="47" width="160" height="7" rx="3.5" fill="#1E293B" />
      <rect x="156" y="47" width="106" height="7" rx="3.5" fill="#EF4444" />
      <text x="330" y="55" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">67%</text>
    </g>

    <!-- TASK 2: SHOULD DO (Medium Priority) -->
    <g transform="translate(18, 162)">
      <rect width="378" height="62" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
      <rect x="12" y="12" width="24" height="20" rx="6" fill="url(#p2Grad)" />
      <text x="24" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P2</text>
      <rect x="42" y="12" width="58" height="20" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
      <text x="71" y="26" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">02:00 PM</text>
      <text x="108" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Quarterly Budget Review</text>
      <circle cx="356" cy="22" r="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <!-- Attachments pill -->
      <rect x="12" y="38" width="112" height="16" rx="4" fill="#1E293B" />
      <text x="68" y="49.5" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">📎 2 Photo Receipts</text>
    </g>

    <!-- TASK 3: COULD DO (Low Priority) -->
    <g transform="translate(18, 234)">
      <rect width="378" height="46" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <rect x="12" y="13" width="24" height="20" rx="6" fill="url(#p3Grad)" />
      <text x="24" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P3</text>
      <text x="46" y="27" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Review team sprint notes</text>
      <circle cx="356" cy="23" r="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    </g>

    <!-- Bottom Quick Stats Row in App -->
    <g transform="translate(18, 292)">
      <rect width="378" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🔥 7-Day Streak Active</text>
      <text x="250" y="24" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">🏆 Level 4 Champion</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT SIDE: 3 Clean Power Feature Spotlights -->
  <!-- ============================================== -->

  <!-- FEATURE 1: Clock Face Time Picker & Chronological Schedule -->
  <g transform="translate(484, 76)" filter="url(#cardShadow)">
    <rect width="268" height="104" rx="14" fill="url(#sideCardGrad)" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Clock Dial Icon Badge -->
    <rect x="16" y="16" width="38" height="38" rx="10" fill="#0C4A6E" stroke="#0284C7" stroke-width="1" />
    <circle cx="35" cy="35" r="10" stroke="#38BDF8" stroke-width="2" />
    <path d="M 35 29 L 35 35 L 39 37" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <!-- Content -->
    <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Clock Face Time Picker</text>
    <text x="64" y="46" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">CHRONOLOGICAL SCHEDULING</text>
    <!-- Feature Chips -->
    <rect x="16" y="66" width="108" height="22" rx="6" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="1" />
    <text x="70" y="80.5" fill="#BAE6FD" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Interactive Clock Dial</text>
    <rect x="132" y="66" width="118" height="22" rx="6" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="1" />
    <text x="191" y="80.5" fill="#BAE6FD" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Apple &amp; Google .ICS</text>
  </g>

  <!-- FEATURE 2: Continuous Voice Dictation & Rapid Notes -->
  <g transform="translate(484, 196)" filter="url(#cardShadow)">
    <rect width="268" height="104" rx="14" fill="url(#sideCardGrad)" stroke="#A855F7" stroke-width="1.2" />
    <!-- Mic Icon Badge -->
    <rect x="16" y="16" width="38" height="38" rx="10" fill="#581C87" stroke="#7E22CE" stroke-width="1" />
    <path d="M 35 27 C 33 27 31 29 31 31 L 31 37 C 31 39 33 41 35 41 C 37 41 39 39 39 37 L 39 31 C 39 29 37 27 35 27 Z" fill="#C084FC" />
    <path d="M 29 35 C 29 39 31 42 35 42 C 39 42 41 39 41 35" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" />
    <!-- Content -->
    <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Voice Dictation &amp; Notes</text>
    <text x="64" y="46" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">HANDS-FREE CAPTURE</text>
    <!-- Feature Chips -->
    <rect x="16" y="66" width="116" height="22" rx="6" fill="#6B21A8" fill-opacity="0.3" stroke="#7E22CE" stroke-width="1" />
    <text x="74" y="80.5" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Spoken Punctuation</text>
    <rect x="140" y="66" width="110" height="22" rx="6" fill="#6B21A8" fill-opacity="0.3" stroke="#7E22CE" stroke-width="1" />
    <text x="195" y="80.5" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Dual Skin OS</text>
  </g>

  <!-- FEATURE 3: Zero-Knowledge Multi-Device Sync & Privacy -->
  <g transform="translate(484, 316)" filter="url(#cardShadow)">
    <rect width="268" height="104" rx="14" fill="url(#sideCardGrad)" stroke="#10B981" stroke-width="1.2" />
    <!-- Shield / Lock Badge -->
    <rect x="16" y="16" width="38" height="38" rx="10" fill="#064E3B" stroke="#047857" stroke-width="1" />
    <rect x="28" y="31" width="14" height="11" rx="2" stroke="#34D399" stroke-width="1.5" />
    <path d="M 31 31 L 31 28 C 31 26 33 24 35 24 C 37 24 39 26 39 28 L 39 31" stroke="#34D399" stroke-width="1.5" />
    <!-- Content -->
    <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Zero-Knowledge Sync</text>
    <text x="64" y="46" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">AES-256-GCM ENCRYPTED</text>
    <!-- Feature Chips -->
    <rect x="16" y="66" width="108" height="22" rx="6" fill="#047857" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
    <text x="70" y="80.5" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">6-Digit Pairing</text>
    <rect x="132" y="66" width="118" height="22" rx="6" fill="#047857" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
    <text x="191" y="80.5" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">24h Shadow Backups</text>
  </g>
</svg>
