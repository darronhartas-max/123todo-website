<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- Priority Gradients -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="160" cy="140" r="140" fill="#3B82F6" opacity="0.16" filter="url(#glow)" />
  <circle cx="660" cy="180" r="160" fill="#10B981" opacity="0.14" filter="url(#glow)" />
  <circle cx="420" cy="350" r="180" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="4 6" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="4 6" />
    <line x1="400" y1="0" x2="400" y2="450" stroke-dasharray="4 6" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="4 6" />
  </g>

  <!-- Top Badge: Beginner's Guide -->
  <g transform="translate(250, 28)">
    <rect width="300" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="34" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      123 TO DO • BEGINNER'S QUICK START
    </text>
  </g>

  <!-- LEFT PANEL: The Core 1-2-3 Methodology -->
  <g transform="translate(48, 80)" filter="url(#cardShadow)">
    <rect width="360" height="326" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="360" height="44" rx="16" fill="#1E293B" />
    <circle cx="22" cy="22" r="5" fill="#EF4444" />
    <circle cx="36" cy="22" r="5" fill="#F59E0B" />
    <circle cx="50" cy="22" r="5" fill="#10B981" />
    <text x="70" y="27" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      The 1-2-3 Daily Priority Rule
    </text>

    <!-- Priority 1 Task -->
    <g transform="translate(18, 60)">
      <rect width="324" height="68" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
      <rect x="12" y="14" width="40" height="40" rx="8" fill="url(#p1Grad)" />
      <text x="32" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle">1</text>
      <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Must Do Today</text>
      <text x="64" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Your top 1–3 non-negotiables</text>
      <!-- Completed Checkmark Circle -->
      <circle cx="296" cy="34" r="12" fill="#10B981" />
      <path d="M 291 34 L 295 38 L 302 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Priority 2 Task -->
    <g transform="translate(18, 142)">
      <rect width="324" height="68" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
      <rect x="12" y="14" width="40" height="40" rx="8" fill="url(#p2Grad)" />
      <text x="32" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle">2</text>
      <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Should Do Today</text>
      <text x="64" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">High-value tasks that advance projects</text>
      <!-- Edit pencil icon representation -->
      <circle cx="296" cy="34" r="12" fill="#334155" />
      <path d="M 292 37 L 298 31 L 300 33 L 294 39 Z" fill="#CBD5E1" />
    </g>

    <!-- Priority 3 Task -->
    <g transform="translate(18, 224)">
      <rect width="324" height="68" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="40" height="40" rx="8" fill="url(#p3Grad)" />
      <text x="32" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle">3</text>
      <text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Could Do (If Time Permits)</text>
      <text x="64" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Low-stress quick wins and backlog</text>
      <!-- Plus adder icon -->
      <circle cx="296" cy="34" r="12" fill="#334155" />
      <path d="M 296 29 L 296 39 M 291 34 L 301 34" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- RIGHT PANEL: Alleviating Consumer Fears (3 Assurance Cards) -->
  <g transform="translate(432, 80)" filter="url(#cardShadow)">
    
    <!-- Assurance Card 1: Data Never Lost -->
    <g transform="translate(0, 0)">
      <rect width="320" height="96" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2" />
      <!-- Shield Icon -->
      <rect x="16" y="18" width="44" height="44" rx="10" fill="#064E3B" />
      <path d="M 38 27 L 48 31 L 48 41 C 48 47 43 51 38 53 C 33 51 28 47 28 41 L 28 31 Z" fill="#10B981" />
      <path d="M 34 40 L 37 43 L 43 37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="70" y="36" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
        Auto-Saved on Your Device
      </text>
      <text x="70" y="54" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" line-height="1.4">
        Close Safari or restart anytime.
      </text>
      <text x="70" y="70" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        ✓ 100% offline • Zero data loss
      </text>
    </g>

    <!-- Assurance Card 2: 1-Tap Home Screen Access (No App Store) -->
    <g transform="translate(0, 114)">
      <rect width="320" height="96" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <!-- Smartphone Icon -->
      <rect x="16" y="18" width="44" height="44" rx="10" fill="#0C4A6E" />
      <rect x="29" y="27" width="18" height="26" rx="3" fill="#38BDF8" />
      <rect x="31" y="29" width="14" height="18" rx="1.5" fill="#0369A1" />
      <circle cx="38" cy="50" r="1.5" fill="#FFFFFF" />
      <text x="70" y="36" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
        Add to Home Screen in 1 Tap
      </text>
      <text x="70" y="54" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Tap Share (⬆️) → Add to Home Screen.
      </text>
      <text x="70" y="70" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        ✓ Opens like an app • No 200MB download
      </text>
    </g>

    <!-- Assurance Card 3: Seamless & Private Cross-Device Sync -->
    <g transform="translate(0, 228)">
      <rect width="320" height="96" rx="14" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.2" />
      <!-- Pair Devices Icon -->
      <rect x="16" y="18" width="44" height="44" rx="10" fill="#4C1D95" />
      <circle cx="34" cy="40" r="9" fill="#8B5CF6" />
      <circle cx="44" cy="40" r="6" fill="#A78BFA" opacity="0.8" />
      <text x="34" y="43" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">6#</text>
      <text x="70" y="36" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
        Instant 6-Digit Device Pairing
      </text>
      <text x="70" y="54" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Pair phone and computer in seconds.
      </text>
      <text x="70" y="70" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        ✓ Zero sign-up • AES-256 encrypted
      </text>
    </g>
  </g>
</svg>
