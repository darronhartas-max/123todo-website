<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Light Glows -->
  <circle cx="220" cy="180" r="180" fill="#2563EB" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="580" cy="240" r="200" fill="#38BDF8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="400" cy="380" r="140" fill="#34D399" opacity="0.08" filter="url(#softGlow)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="4 6" />
    <line x1="160" y1="0" x2="160" y2="450" stroke-dasharray="4 6" />
    <line x1="320" y1="0" x2="320" y2="450" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="450" stroke-dasharray="4 6" />
    <line x1="640" y1="0" x2="640" y2="450" stroke-dasharray="4 6" />
  </g>

  <!-- ==================== LEFT: MOBILE PHONE WITH HOME SCREEN PWA ICON ==================== -->
  <g transform="translate(90, 45)" filter="url(#cardShadow)">
    <!-- Phone Chassis -->
    <rect width="210" height="360" rx="34" fill="url(#phoneGrad)" stroke="#475569" stroke-width="2" />
    <rect x="8" y="8" width="194" height="344" rx="28" fill="url(#screenGrad)" />

    <!-- Speaker Dynamic Island / Notch -->
    <rect x="75" y="16" width="60" height="14" rx="7" fill="#000000" stroke="#334155" stroke-width="0.8" />
    <circle cx="120" cy="23" r="3" fill="#1E293B" />

    <!-- Phone Status Header -->
    <text x="32" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">9:41</text>
    <g transform="translate(155, 30)">
      <path d="M 0 6 A 6 6 0 0 1 12 6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <rect x="18" y="2" width="12" height="7" rx="1.5" stroke="#94A3B8" stroke-width="1" fill="none" />
    </g>

    <!-- App Grid on Phone Screen -->
    <!-- Regular apps -->
    <rect x="25" y="65" width="38" height="38" rx="10" fill="#334155" opacity="0.4" />
    <rect x="86" y="65" width="38" height="38" rx="10" fill="#334155" opacity="0.4" />
    <rect x="147" y="65" width="38" height="38" rx="10" fill="#334155" opacity="0.4" />

    <rect x="25" y="125" width="38" height="38" rx="10" fill="#334155" opacity="0.4" />
    
    <!-- HIGHLIGHTED: 123 ToDo PWA Icon -->
    <g transform="translate(80, 118)">
      <!-- Animated Pulse Ring -->
      <rect x="-4" y="-4" width="58" height="58" rx="15" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7" stroke-dasharray="4 4" />
      <rect width="50" height="50" rx="12" fill="url(#blueGlow)" stroke="#60A5FA" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="25" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">123</text>
      <text x="25" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="8" fill="#BAE6FD" text-anchor="middle" letter-spacing="0.5">TODO</text>
      <text x="25" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">123 To Do</text>
      <!-- Installed PWA Badge -->
      <circle cx="44" cy="6" r="6" fill="#10B981" stroke="#0F172A" stroke-width="1.5" />
      <path d="M 41.5 6 L 43.5 8 L 47 4.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <rect x="147" y="125" width="38" height="38" rx="10" fill="#334155" opacity="0.4" />

    <!-- "Add to Home Screen" Callout Banner inside Phone -->
    <g transform="translate(20, 215)">
      <rect width="170" height="74" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <!-- Safari Share Icon -->
      <g transform="translate(12, 14)">
        <rect x="3" y="12" width="18" height="18" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.8" />
        <path d="M 12 3 L 12 18 M 7 8 L 12 3 L 17 8" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="42" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Add to Home Screen</text>
      <text x="42" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">1-Tap Safari / Chrome</text>
      <text x="42" y="58" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600">⚡ Installs in 5 Seconds</text>
    </g>

    <!-- Bottom Home Bar -->
    <rect x="70" y="338" width="70" height="3.5" rx="1.75" fill="#64748B" />
  </g>

  <!-- ==================== RIGHT: DESKTOP & PWA BENEFITS CARD ==================== -->
  <g transform="translate(340, 45)" filter="url(#cardShadow)">
    <!-- Main Info Box -->
    <rect width="410" height="360" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />

    <!-- Header Banner -->
    <g transform="translate(24, 24)">
      <!-- PWA Badge -->
      <rect width="175" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#0284C7" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38BDF8" />
      <text x="26" y="18" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PROGRESSIVE WEB APP</text>
      
      <text x="362" y="18" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="end">100% Free</text>
    </g>

    <!-- Title -->
    <text x="24" y="82" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">Install 123 To Do Anywhere</text>
    <text x="24" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">No App Store • No Passwords • No Big Downloads</text>

    <!-- Feature 1: Offline Freedom -->
    <g transform="translate(24, 126)">
      <rect width="362" height="52" rx="10" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="26" cy="26" r="14" fill="rgba(56, 189, 248, 0.15)" />
      <text x="26" y="30" font-size="14" text-anchor="middle">✈️</text>
      <text x="50" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">100% Offline Capability</text>
      <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Works on subways, flights, and remote field sites</text>
    </g>

    <!-- Feature 2: 1-Tap Home Screen Launch -->
    <g transform="translate(24, 188)">
      <rect width="362" height="52" rx="10" fill="#0F172A" stroke="#065F46" stroke-width="1" />
      <circle cx="26" cy="26" r="14" fill="rgba(16, 185, 129, 0.15)" />
      <text x="26" y="30" font-size="14" text-anchor="middle">📲</text>
      <text x="50" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Instant 1-Tap Home Screen Icon</text>
      <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Launch directly from iOS, Android, Mac &amp; Windows</text>
    </g>

    <!-- Feature 3: Distraction Free Window -->
    <g transform="translate(24, 250)">
      <rect width="362" height="52" rx="10" fill="#0F172A" stroke="#581C87" stroke-width="1" />
      <circle cx="26" cy="26" r="14" fill="rgba(168, 85, 247, 0.15)" />
      <text x="26" y="30" font-size="14" text-anchor="middle">🖥️</text>
      <text x="50" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Distraction-Free Standalone Window</text>
      <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">No browser tabs, URL bars, or accidental closing</text>
    </g>

    <!-- Bottom Platform Badges -->
    <g transform="translate(24, 316)">
      <rect width="80" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="40" y="16" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🍏 iOS Safari</text>

      <rect x="88" y="0" width="86" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="131" y="16" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🤖 Android</text>

      <rect x="182" y="0" width="84" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="224" y="16" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">💻 macOS</text>

      <rect x="274" y="0" width="88" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="318" y="16" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🪟 Windows</text>
    </g>
  </g>
</svg>
