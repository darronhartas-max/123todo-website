<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="45%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Lightbox Overlay Gradient -->
    <linearGradient id="lightboxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Light Flares -->
  <circle cx="180" cy="140" r="220" fill="#0EA5E9" opacity="0.12" filter="url(#glowEffect)" />
  <circle cx="650" cy="300" r="240" fill="#6366F1" opacity="0.15" filter="url(#glowEffect)" />
  <circle cx="400" cy="40" r="160" fill="#38BDF8" opacity="0.08" filter="url(#glowEffect)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="6 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="6 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="6 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="6 6" />
    <line x1="160" y1="0" x2="160" y2="450" stroke-dasharray="6 6" />
    <line x1="320" y1="0" x2="320" y2="450" stroke-dasharray="6 6" />
    <line x1="480" y1="0" x2="480" y2="450" stroke-dasharray="6 6" />
    <line x1="640" y1="0" x2="640" y2="450" stroke-dasharray="6 6" />
  </g>

  <!-- Left: Main Note & Task Card with Photo Attachments -->
  <g transform="translate(60, 45)" filter="url(#cardShadow)">
    <rect width="440" height="350" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(24, 22)">
      <!-- Priority Pill -->
      <rect width="78" height="24" rx="12" fill="rgba(220, 38, 38, 0.15)" stroke="#DC2626" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#DC2626" />
      <text x="22" y="16" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MUST DO</text>

      <!-- Project Tag -->
      <g transform="translate(86, 0)">
        <rect width="112" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#0284C7" stroke-width="1" />
        <circle cx="12" cy="12" r="4" fill="#38BDF8" />
        <text x="22" y="16" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Field Projects</text>
      </g>

      <!-- Task Title -->
      <text x="0" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Site Inspection &amp; Delivery Receipts</text>

      <!-- Notes Text Box Mockup -->
      <g transform="translate(0, 70)">
        <rect width="392" height="58" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Materials arrived 08:30. Checked steel beams, scaffolding,</text>
        <text x="14" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">and safety rails. Signed supplier delivery docket attached below.</text>
      </g>
    </g>

    <!-- Photo Attachments Section Inside Note -->
    <g transform="translate(24, 175)">
      <!-- Section Header -->
      <g>
        <text x="0" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Photo Attachments (3 / 3)</text>
        <text x="160" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• WebP Auto-Compressed</text>
      </g>

      <!-- Action Buttons Row -->
      <g transform="translate(0, 26)">
        <!-- Camera Button -->
        <g>
          <rect width="88" height="28" rx="6" fill="#0284C7" />
          <path d="M12 18 C11.4 18 11 17.6 11 17 L11 11 C11 10.4 11.4 10 12 10 L14 10 L15 8.5 L19 8.5 L20 10 L22 10 C22.6 10 23 10.4 23 11 L23 17 C23 17.6 22.6 18 22 18 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
          <circle cx="17" cy="14" r="2.5" stroke="#FFFFFF" stroke-width="1.5" />
          <text x="29" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Camera</text>
        </g>

        <!-- Attach Button -->
        <g transform="translate(94, 0)">
          <rect width="82" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
          <path d="M13 15 L18 10 C19.5 8.5 21.5 10.5 20 12 L14.5 17.5 C13.5 18.5 12 18.5 11 17.5 C10 16.5 10 15 11 14 L16.5 8.5" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
          <text x="27" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Attach</text>
        </g>

        <!-- Clipboard Paste Badge -->
        <g transform="translate(182, 0)">
          <rect width="118" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="10" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Paste: <tspan fill="#38BDF8" font-weight="700">⌘V / Ctrl+V</tspan></text>
        </g>
      </g>

      <!-- Thumbnails Grid (3 Photos) -->
      <g transform="translate(0, 64)">
        <!-- Photo 1: Site Photo -->
        <g>
          <rect width="118" height="74" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
          <!-- Abstract Site Photo Graphic -->
          <path d="M10 58 L45 28 L75 52 L95 38 L110 58 Z" fill="#0284C7" opacity="0.6" />
          <path d="M40 58 L70 32 L95 50 L110 38 L118 50 L118 58 Z" fill="#0369A1" opacity="0.8" />
          <circle cx="28" cy="22" r="7" fill="#FDE047" opacity="0.9" />
          <!-- Size badge -->
          <rect x="6" y="52" width="46" height="16" rx="4" fill="rgba(0,0,0,0.65)" />
          <text x="12" y="64" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">182 KB</text>
        </g>

        <!-- Photo 2: Receipt / Document -->
        <g transform="translate(126, 0)">
          <rect width="118" height="74" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
          <!-- Abstract Receipt Rows -->
          <rect x="18" y="12" width="82" height="6" rx="2" fill="#94A3B8" opacity="0.7" />
          <rect x="18" y="24" width="60" height="4" rx="2" fill="#64748B" opacity="0.6" />
          <rect x="18" y="32" width="70" height="4" rx="2" fill="#64748B" opacity="0.6" />
          <rect x="18" y="40" width="50" height="4" rx="2" fill="#64748B" opacity="0.6" />
          <rect x="18" y="50" width="82" height="1" fill="#475569" />
          <rect x="60" y="56" width="40" height="6" rx="2" fill="#10B981" opacity="0.8" />
          <!-- Size badge -->
          <rect x="6" y="52" width="46" height="16" rx="4" fill="rgba(0,0,0,0.65)" />
          <text x="12" y="64" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">145 KB</text>
        </g>

        <!-- Photo 3: Screen Grab -->
        <g transform="translate(252, 0)">
          <rect width="118" height="74" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
          <!-- Abstract Chart / Screenshot -->
          <rect x="14" y="12" width="90" height="40" rx="4" fill="#1E293B" />
          <polyline points="20,44 42,28 65,36 85,20 96,24" fill="none" stroke="#A855F7" stroke-width="2" />
          <circle cx="85" cy="20" r="3" fill="#C084FC" />
          <!-- Size badge -->
          <rect x="6" y="52" width="46" height="16" rx="4" fill="rgba(0,0,0,0.65)" />
          <text x="12" y="64" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">210 KB</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: High-Res Lightbox Modal Overlay (Preview) -->
  <g transform="translate(480, 75)" filter="url(#cardShadow)">
    <rect width="280" height="290" rx="16" fill="url(#lightboxGrad)" stroke="#38BDF8" stroke-width="2" />

    <!-- Lightbox Header -->
    <g transform="translate(16, 16)">
      <rect width="248" height="28" rx="6" fill="#0F172A" />
      <circle cx="16" cy="14" r="5" fill="#EF4444" />
      <circle cx="32" cy="14" r="5" fill="#F59E0B" />
      <circle cx="48" cy="14" r="5" fill="#10B981" />
      <text x="64" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Lightbox • delivery-docket.webp</text>
    </g>

    <!-- Lightbox Main Zoom Image Area -->
    <g transform="translate(16, 56)">
      <rect width="248" height="175" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
      <!-- Sharp Document Simulation -->
      <g transform="translate(24, 20)">
        <rect width="200" height="135" rx="4" fill="#F8FAFC" />
        <rect x="14" y="14" width="70" height="8" rx="2" fill="#0284C7" />
        <rect x="14" y="28" width="172" height="2" fill="#E2E8F0" />
        <rect x="14" y="38" width="50" height="4" rx="2" fill="#475569" />
        <rect x="140" y="38" width="46" height="4" rx="2" fill="#475569" />
        <rect x="14" y="48" width="80" height="4" rx="2" fill="#64748B" />
        <rect x="140" y="48" width="46" height="4" rx="2" fill="#059669" />
        <rect x="14" y="58" width="65" height="4" rx="2" fill="#64748B" />
        <rect x="140" y="58" width="46" height="4" rx="2" fill="#059669" />
        <!-- Stamp / Signature -->
        <circle cx="155" cy="95" r="18" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="3 2" />
        <text x="134" y="98" fill="#DC2626" font-family="sans-serif" font-size="7" font-weight="700">DELIVERED</text>
      </g>
    </g>

    <!-- Lightbox Controls Bar -->
    <g transform="translate(16, 242)">
      <rect width="248" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(12, 10)">
        <!-- Zoom Badge -->
        <rect width="64" height="18" rx="4" fill="#0284C7" />
        <text x="8" y="13" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">🔍 2.0x Zoom</text>

        <!-- Resolution & Size -->
        <text x="76" y="14" fill="#94A3B8" font-family="sans-serif" font-size="10">2048×1536 (WebP)</text>

        <!-- Download Icon -->
        <g transform="translate(210, 1)">
          <path d="M4 1 L4 8 M1 5 L4 8 L7 5 M0 11 L8 11" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Feature Badges -->
  <!-- 100% Free Badge -->
  <g transform="translate(620, 25)">
    <rect width="135" height="30" rx="15" fill="#065F46" stroke="#34D399" stroke-width="1.5" filter="url(#glowEffect)" opacity="0.9" />
    <text x="18" y="20" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">✨ 100% FREE FEATURE</text>
  </g>
</svg>
