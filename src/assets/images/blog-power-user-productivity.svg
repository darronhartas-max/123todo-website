<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="160" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />
  <circle cx="640" cy="300" r="180" fill="#8B5CF6" opacity="0.16" filter="url(#glow)" />
  <circle cx="400" cy="220" r="120" fill="#10B981" opacity="0.1" filter="url(#glow)" />

  <!-- Geometric Tech Grid Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="800" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="4 6" />
    <line x1="160" y1="0" x2="160" y2="450" stroke-dasharray="4 6" />
    <line x1="320" y1="0" x2="320" y2="450" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="450" stroke-dasharray="4 6" />
    <line x1="640" y1="0" x2="640" y2="450" stroke-dasharray="4 6" />
  </g>

  <!-- Left: Main Focus Task Pipeline Card -->
  <g transform="translate(48, 55)" filter="url(#cardShadow)">
    <rect width="420" height="340" rx="20" fill="#1E293B" stroke="#475569" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(24, 24)">
      <rect width="130" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#0284C7" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38BDF8" />
      <text x="26" y="18" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">THE 1-2-3 ENGINE</text>

      <text x="340" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="end">Daily Sprint</text>
    </g>

    <!-- Task Row 1: P1 Must Do (Active execution) -->
    <g transform="translate(24, 68)">
      <rect width="372" height="64" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
      <!-- Priority Badge -->
      <rect x="12" y="12" width="38" height="22" rx="6" fill="url(#p1Grad)" />
      <text x="31" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" text-anchor="middle">P1</text>
      <!-- Task Title -->
      <text x="58" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Launch Q3 Strategy &amp; Close Deal</text>
      <!-- Sub-line -->
      <text x="58" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">🔥 High-leverage needle mover • Focus block active</text>
      <!-- Checkbox / Ring -->
      <circle cx="346" cy="32" r="12" fill="none" stroke="#EF4444" stroke-width="2" />
      <circle cx="346" cy="32" r="5" fill="#EF4444" />
    </g>

    <!-- Task Row 2: P2 Should Do -->
    <g transform="translate(24, 144)">
      <rect width="372" height="58" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="38" height="22" rx="6" fill="url(#p2Grad)" />
      <text x="31" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" text-anchor="middle">P2</text>
      <text x="58" y="27" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Review Supplier Estimates &amp; Signoff</text>
      <text x="58" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">2 attachments • Due 3:00 PM</text>
      <circle cx="346" cy="29" r="10" fill="none" stroke="#475569" stroke-width="1.5" />
    </g>

    <!-- Task Row 3: P3 Could Do -->
    <g transform="translate(24, 214)">
      <rect width="372" height="52" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.8" />
      <rect x="12" y="10" width="38" height="20" rx="6" fill="url(#p3Grad)" />
      <text x="31" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" text-anchor="middle">P3</text>
      <text x="58" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Organize Reference Notes Archive</text>
      <text x="58" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Backlog queue • No urgency</text>
      <circle cx="346" cy="26" r="10" fill="none" stroke="#475569" stroke-width="1.5" />
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(24, 280)">
      <rect width="372" height="36" rx="8" fill="#0F172A" />
      <text x="14" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">⚡ Velocity: +200%</text>
      <text x="358" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">0 Decisions Wasted</text>
    </g>
  </g>

  <!-- Right: Power User Pillars -->
  <!-- Top Right Card: Keyboard & Quick Capture -->
  <g transform="translate(492, 55)" filter="url(#cardShadow)">
    <rect width="260" height="155" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
    
    <g transform="translate(20, 20)">
      <rect width="32" height="32" rx="8" fill="#6366F1" opacity="0.2" />
      <!-- Keyboard Icon -->
      <rect x="6" y="8" width="20" height="16" rx="3" fill="none" stroke="#818CF8" stroke-width="1.5" />
      <circle cx="11" cy="13" r="1" fill="#818CF8" />
      <circle cx="16" cy="13" r="1" fill="#818CF8" />
      <circle cx="21" cy="13" r="1" fill="#818CF8" />
      <line x1="10" y1="19" x2="22" y2="19" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />

      <text x="42" y="16" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="1">HOTKEY COMMANDS</text>
      <text x="42" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Muscle Memory</text>

      <g transform="translate(0, 48)">
        <rect width="68" height="22" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
        <text x="34" y="15" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">⌘+K / N</text>
        <text x="78" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Instant Task &amp; Search</text>
      </g>

      <g transform="translate(0, 78)">
        <rect width="68" height="22" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
        <text x="34" y="15" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">⌘+V</text>
        <text x="78" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Direct Clipboard Paste</text>
      </g>
    </g>
  </g>

  <!-- Bottom Right Card: Simple Voice Notes & Dictation -->
  <g transform="translate(492, 230)" filter="url(#cardShadow)">
    <rect width="260" height="165" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    
    <g transform="translate(20, 20)">
      <rect width="32" height="32" rx="8" fill="#F59E0B" opacity="0.2" />
      <!-- Mic Icon -->
      <rect x="12" y="7" width="8" height="12" rx="4" fill="#FBBF24" />
      <path d="M 8 13 C 8 18 24 18 24 13" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="19" x2="16" y2="24" stroke="#FBBF24" stroke-width="1.5" />

      <text x="42" y="16" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="1">VOICE-FIRST SPEED</text>
      <text x="42" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Simple Voice Skin</text>

      <text x="0" y="66" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">3x Faster than Typing:</text>
      <text x="0" y="84" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Real-time spoken punctuation</text>
      <text x="0" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Voice edits: "scratch that"</text>
      <text x="0" y="120" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Auto-saves to Unassigned Inbox</text>
    </g>
  </g>
</svg>
