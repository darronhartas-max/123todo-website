<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bgGradReview" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1F5F9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="8" fill="url(#bgGradReview)"/>

  <!-- Main App Card Mockup -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="280" height="220" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
    
    <!-- Top Header Bar -->
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#285A82"/>
    <rect x="0" y="28" width="280" height="12" fill="#285A82"/>
    <circle cx="24" cy="20" r="6" fill="#60A5FA"/>
    <rect x="40" y="16" width="80" height="8" rx="4" fill="#FFFFFF"/>
    
    <!-- Microphone Voice Badge -->
    <g transform="translate(235, 20)">
      <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.2)"/>
      <path d="M-3 -4 C-3 -6 3 -6 3 -4 L3 1 C3 3 -3 3 -3 1 Z" fill="#FFFFFF"/>
      <path d="M-6 0 C-6 5 6 5 6 0" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <line x1="0" y1="5" x2="0" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Priority Sections Mockup -->
    <!-- P1 Must Do -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="240" height="38" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="38" rx="2" fill="#DC2626"/>
      <circle cx="22" cy="19" r="6" stroke="#DC2626" stroke-width="2" fill="none"/>
      <rect x="36" y="15" width="120" height="8" rx="4" fill="#1E293B"/>
      <rect x="200" y="14" width="24" height="10" rx="5" fill="rgba(220, 38, 38, 0.1)"/>
    </g>

    <!-- P2 Should Do -->
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="240" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="38" rx="2" fill="#F59E0B"/>
      <circle cx="22" cy="19" r="6" stroke="#F59E0B" stroke-width="2" fill="none"/>
      <rect x="36" y="15" width="140" height="8" rx="4" fill="#475569"/>
    </g>

    <!-- P3 Could Do -->
    <g transform="translate(20, 148)">
      <rect x="0" y="0" width="240" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="38" rx="2" fill="#64748B"/>
      <circle cx="22" cy="19" r="6" stroke="#10B981" stroke-width="2" fill="#10B981"/>
      <path d="M19 19 L21 21 L25 17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="36" y="15" width="100" height="8" rx="4" fill="#94A3B8"/>
    </g>

    <!-- Bottom Footer Bar -->
    <g transform="translate(20, 196)">
      <rect x="0" y="0" width="100" height="14" rx="7" fill="rgba(16, 185, 129, 0.15)"/>
      <circle cx="10" cy="7" r="3" fill="#10B981"/>
      <rect x="18" y="4" width="70" height="6" rx="3" fill="#10B981"/>
    </g>
  </g>

  <!-- Editor Choice Rating Ribbon Badge -->
  <g transform="translate(325, 65)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <path d="M-6 8 L-12 24 L0 18 L12 24 L6 8 Z" fill="#D97706"/>
    <!-- 5 Stars -->
    <path d="M0 -14 L2 -8 L8 -8 L3 -4 L5 2 L0 -1 L-5 2 L-3 -4 L-8 -8 L-2 -8 Z" fill="#FFFFFF"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" font-weight="800" fill="#FFFFFF" font-family="sans-serif">9.8/10</text>
  </g>

  <!-- Encrypted Shield Badge -->
  <g transform="translate(45, 235)">
    <circle cx="0" cy="0" r="20" fill="#10B981" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <path d="M0 -10 L10 -5 L10 2 C10 8 5 12 0 14 C-5 12 -10 8 -10 2 L-10 -5 Z" fill="#FFFFFF"/>
    <path d="M-3 -1 L3 -1 L3 4 L-3 4 Z" fill="#10B981"/>
    <circle cx="0" cy="-3" r="2" fill="#10B981"/>
  </g>
</svg>
