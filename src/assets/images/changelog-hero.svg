<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Panel Gradients -->
    <linearGradient id="mainCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="sideCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="576" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#3B82F6" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="860" cy="380" r="160" fill="#10B981" opacity="0.07" filter="url(#softGlow)" />
  <circle cx="640" cy="100" r="120" fill="#A855F7" opacity="0.06" filter="url(#softGlow)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.8">
    <line x1="48" y1="48" x2="976" y2="48" />
    <line x1="48" y1="528" x2="976" y2="528" />
    <line x1="48" y1="48" x2="48" y2="528" />
    <line x1="976" y1="48" x2="976" y2="528" />
    <line x1="616" y1="48" x2="616" y2="528" stroke-dasharray="4 4" />
  </g>

  <!-- ============================================== -->
  <!-- TOP HEADER / RELEASE PIPELINE CONTROLS -->
  <!-- ============================================== -->
  <g transform="translate(48, 24)">
    <!-- Terminal Window Dots -->
    <circle cx="8" cy="14" r="5" fill="#EF4444" />
    <circle cx="24" cy="14" r="5" fill="#F59E0B" />
    <circle cx="40" cy="14" r="5" fill="#10B981" />

    <!-- Title & System Breadcrumb -->
    <text x="64" y="18" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">123 To Do • Continuous Release &amp; Build History</text>

    <!-- Top Status Badges (Right aligned) -->
    <!-- Current Version Pill -->
    <g transform="translate(620, 2)">
      <rect width="108" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#34D399" />
      <text x="58" y="16" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">v3.7.43 Live</text>
    </g>

    <!-- Total Releases Badge -->
    <g transform="translate(738, 2)">
      <rect width="102" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="51" y="16" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">170+ Builds</text>
    </g>

    <!-- MIT Open Source Badge -->
    <g transform="translate(850, 2)">
      <rect width="78" height="24" rx="12" fill="#0C4A6E" stroke="#0284C7" stroke-width="1" />
      <text x="39" y="16" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIT OSS</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- LEFT COLUMN: LATEST PRODUCTION RELEASE SPOTLIGHT -->
  <!-- ============================================== -->
  <g transform="translate(48, 64)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="548" height="464" rx="16" fill="url(#mainCardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Header Badge Strip -->
    <g transform="translate(24, 24)">
      <rect width="168" height="26" rx="6" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
      <text x="84" y="17" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LATEST STABLE RELEASE</text>

      <rect x="180" y="0" width="82" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="221" y="17" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">v3.7.43</text>
    </g>

    <!-- Main Title of Current Era -->
    <text x="24" y="84" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Phase 5: Modern Era &amp; Frictionless Flow</text>
    <text x="24" y="106" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500">Every feature engineered for zero friction, offline resilience, and total data privacy.</text>

    <!-- Divider Line -->
    <line x1="24" y1="124" x2="524" y2="124" stroke="#334155" stroke-width="1" opacity="0.6" />

    <!-- Feature 1: First-Time User Onboarding & Guidance -->
    <g transform="translate(24, 140)">
      <rect width="500" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="30" r="14" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="28" y="35" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
      <text x="56" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Frictionless First-Time User Experience</text>
      <text x="56" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Non-blocking welcome banner, starter tasks, and disappearing beginner guide</text>
    </g>

    <!-- Feature 2: Clock Face Scheduling & Calendar Sync -->
    <g transform="translate(24, 212)">
      <rect width="500" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="30" r="14" fill="#0C4A6E" stroke="#0284C7" stroke-width="1" />
      <text x="28" y="35" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⏱️</text>
      <text x="56" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Interactive Clock Face Scheduling &amp; .ICS Export</text>
      <text x="56" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Circular analog dial time picker, chronological order, time badges &amp; calendar sync</text>
    </g>

    <!-- Feature 3: Zero-Knowledge Multi-Device Sync -->
    <g transform="translate(24, 284)">
      <rect width="500" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="30" r="14" fill="#581C87" stroke="#7E22CE" stroke-width="1" />
      <text x="28" y="35" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🔒</text>
      <text x="56" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Zero-Knowledge AES-256-GCM Cloud Sync</text>
      <text x="56" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Encrypted client-side sync via Cloudflare D1 serverless edge &amp; Google Drive</text>
    </g>

    <!-- Feature 4: Dual-Skin Operating System & Voice Dictation -->
    <g transform="translate(24, 356)">
      <rect width="500" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="30" r="14" fill="#78350F" stroke="#D97706" stroke-width="1" />
      <text x="28" y="35" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🎙️</text>
      <text x="56" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Dual-Skin OS: Tasks Matrix vs. Voice Notes</text>
      <text x="56" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">1-tap toggle between structured priority tasks and hands-free voice notes</text>
    </g>

    <!-- Bottom Architectural Health Bar -->
    <g transform="translate(24, 426)">
      <rect width="500" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#10B981" />
      <text x="26" y="17" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Zero Regressions</text>
      <circle cx="140" cy="13" r="3.5" fill="#3B82F6" />
      <text x="150" y="17" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">100% Offline PWA</text>
      <circle cx="270" cy="13" r="3.5" fill="#A855F7" />
      <text x="280" y="17" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">24h Shadow Backups</text>
      <circle cx="410" cy="13" r="3.5" fill="#F59E0B" />
      <text x="420" y="17" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Zero Lock-In</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT COLUMN: 5-ERA EVOLUTION TIMELINE PIPELINE -->
  <!-- ============================================== -->
  <g transform="translate(620, 64)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="356" height="464" rx="16" fill="url(#sideCardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(20, 20)">
      <text x="0" y="16" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Evolutionary Roadmap</text>
      <text x="0" y="34" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500">5 distinct phases of transparent growth</text>
    </g>

    <!-- Connecting Vertical Git Branch Line -->
    <line x1="38" y1="86" x2="38" y2="420" stroke="#334155" stroke-width="2" />

    <!-- PHASE 5 NODE (Current Era) -->
    <g transform="translate(20, 72)">
      <circle cx="18" cy="18" r="8" fill="#10B981" />
      <circle cx="18" cy="18" r="4" fill="#FFFFFF" />
      <rect x="36" y="4" width="280" height="54" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
      <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Phase 5: Modern Era (v3.5 – v3.7)</text>
      <text x="48" y="42" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Clock Face, Photo Receipts, Onboarding</text>
    </g>

    <!-- PHASE 4 NODE (Dual-Skin OS) -->
    <g transform="translate(20, 144)">
      <circle cx="18" cy="18" r="7" fill="#3B82F6" />
      <circle cx="18" cy="18" r="3" fill="#FFFFFF" />
      <rect x="36" y="4" width="280" height="54" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="48" y="24" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Phase 4: Dual-Skin OS (v3.0 – v3.4)</text>
      <text x="48" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Voice Notes Skin, 5-App Migration Wizard</text>
    </g>

    <!-- PHASE 3 NODE (Serverless Sync) -->
    <g transform="translate(20, 216)">
      <circle cx="18" cy="18" r="7" fill="#A855F7" />
      <circle cx="18" cy="18" r="3" fill="#FFFFFF" />
      <rect x="36" y="4" width="280" height="54" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="48" y="24" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Phase 3: Serverless Sync (v2.5 – v2.9)</text>
      <text x="48" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Cloudflare D1 E2EE Sync, Voice Dictation</text>
    </g>

    <!-- PHASE 2 NODE (Kanban & Subtasks) -->
    <g transform="translate(20, 288)">
      <circle cx="18" cy="18" r="7" fill="#F59E0B" />
      <circle cx="18" cy="18" r="3" fill="#FFFFFF" />
      <rect x="36" y="4" width="280" height="54" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="48" y="24" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Phase 2: Power Tools (v2.0 – v2.4)</text>
      <text x="48" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Desktop Kanban, Subtasks, Swipe Gestures</text>
    </g>

    <!-- PHASE 1 NODE (Foundations) -->
    <g transform="translate(20, 360)">
      <circle cx="18" cy="18" r="7" fill="#64748B" />
      <circle cx="18" cy="18" r="3" fill="#FFFFFF" />
      <rect x="36" y="4" width="280" height="54" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="48" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Phase 1: Foundations (v1.0 – v1.4)</text>
      <text x="48" y="42" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">1-2-3 Priority Matrix, LocalStorage PWA</text>
    </g>

    <!-- Bottom Note in Timeline -->
    <g transform="translate(20, 426)">
      <text x="178" y="16" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Every release documented &amp; open source under MIT</text>
    </g>
  </g>
</svg>
